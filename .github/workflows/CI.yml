name: CI

# Trigger the workflow on push or pull request
on:
  push:
    branches:
      - master
      - main
  pull_request:

# the `concurrency` settings ensure that not too many CI jobs run in parallel
concurrency:
  # group by workflow and ref; the last slightly strange component ensures that for pull
  # requests, we limit to 1 concurrent job, but for the default repository branch we don't
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_name != github.event.repository.default_branch || github.run_number }}
  # Cancel intermediate builds, but only if it is a pull request build.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # The CI test job
  test:
    name: ${{ matrix.gap-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gap-version:
          - 'devel'   # current GAP development version from git
          - 'latest'  # latest GAP release
          - 'minimal' # oldest GAP release supported by this package

    steps:
      - uses: actions/checkout@v7
      - uses: gap-actions/setup-gap@v3
        with:
          gap-version: ${{ matrix.gap-version }}
      - uses: gap-actions/build-pkg@v3
      - uses: gap-actions/run-pkg-tests@v4
      #- uses: gap-actions/run-pkg-tests@v4
      #  with:
      #    mode: onlyneeded  # FIXME: disabled because the tests depend on too many optional packages
      - uses: gap-actions/process-coverage@v3
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  julia-voronoi:
    name: Julia Voronoi example (GL2, D=-7)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Check out the Julia provider and its pinned environment
        uses: actions/checkout@v7
        with:
          repository: dimpase/arithmetic_voronoi
          ref: 007df75debde04c7469124891ac78d555d5de20b
          path: arithmetic-voronoi
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.2'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Install Julia dependencies
        run: >-
          julia --startup-file=no --project=arithmetic-voronoi
          -e 'using Pkg; Pkg.instantiate(;allow_autoprecomp=false)'
      - name: Precompile Julia provider
        run: >-
          julia --startup-file=no --project=arithmetic-voronoi
          -e 'using Pkg; Pkg.precompile("ArithmeticVoronoi"; strict=true, timing=true)'
      - name: Construct a fresh complex and check integral H1 and H2
        run: >-
          julia --startup-file=no --project=arithmetic-voronoi
          .github/scripts/voronoi-julia.jl
