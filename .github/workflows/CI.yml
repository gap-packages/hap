name: CI

# Trigger the workflow on push or pull request
on:
  push:
    branches:
      - master
      - main
  pull_request:

# the `concurrency` settings ensure that not too many CI jobs run in parallel
concurrency:
  # group by workflow and ref; the last slightly strange component ensures that for pull
  # requests, we limit to 1 concurrent job, but for the default repository branch we don't
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_name != github.event.repository.default_branch || github.run_number }}
  # Cancel intermediate builds, but only if it is a pull request build.
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # The CI test job
  test:
    name: ${{ matrix.gap-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gap-version:
          - 'devel'   # current GAP development version from git
          - 'latest'  # latest GAP release
          - 'minimal' # oldest GAP release supported by this package

    steps:
      - uses: actions/checkout@v7
      - uses: gap-actions/setup-gap@v3
        with:
          gap-version: ${{ matrix.gap-version }}
      - uses: gap-actions/build-pkg@v3
      - name: Install the Singular interface with bigintvec support
        if: matrix.gap-version == 'minimal'
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -O https://github.com/gap-packages/singular/releases/download/v2026.05.05/singular-2026.05.05.tar.gz
          echo 'adb30a57aa5afea34c89cb30c3ba53f1164e7952ed5fd80d11c963c352d9a7d5  singular-2026.05.05.tar.gz' | sha256sum --check
          tar -xzf singular-2026.05.05.tar.gz -C "$GAPROOT/pkg"
          "$GAPROOT/gap" -q --quitonbreak -c 'QUIT_GAP(LoadPackage("singular", ">=2026.05.05") = true);'
      - uses: gap-actions/run-pkg-tests@v4
      #- uses: gap-actions/run-pkg-tests@v4
      #  with:
      #    mode: onlyneeded  # FIXME: disabled because the tests depend on too many optional packages
      - uses: gap-actions/process-coverage@v3
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  julia-voronoi:
    name: Julia Voronoi examples (GL, SL and PSL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Check out the Julia provider at a tested revision
        uses: actions/checkout@v7
        with:
          repository: dimpase/ArithmeticVoronoi.jl
          ref: a50e125ed89692946c305c80447795b8e990eabd # ArithmeticVoronoi v0.1.2
          path: arithmetic-voronoi
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Install Julia dependencies
        run: >-
          julia --startup-file=no --project=arithmetic-voronoi
          -e 'using Pkg; Pkg.instantiate(;allow_autoprecomp=false)'
      - name: Precompile Julia provider
        run: >-
          julia --startup-file=no --project=arithmetic-voronoi
          -e 'using Pkg; Pkg.precompile("ArithmeticVoronoi"; strict=true, timing=true)'
      - name: Construct fresh complexes and check integral homology
        run: >-
          julia --startup-file=no --project=arithmetic-voronoi
          .github/scripts/voronoi-julia.jl
